# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
# Allows the Renovate workflow in pdeslaur/renovate, as it is on main, to open
# and update Renovate's pull requests and its dependency dashboard issue here.
issuer: https://token.actions.githubusercontent.com
# GitHub names the owner and repository with their IDs in the subject.
subject: repo:pdeslaur@1692704/renovate@1473368897:ref:refs/heads/main
claim_pattern:
    event_name: (schedule|workflow_dispatch)
    job_workflow_ref: pdeslaur/renovate/\.github/workflows/renovate\.yml@refs/heads/main

permissions:
    checks: read
    contents: write
    issues: write
    pull_requests: write
    statuses: read
    # Renovate updates the actions that workflows use.
    workflows: write
